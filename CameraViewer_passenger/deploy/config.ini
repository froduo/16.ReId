[Update]
; 更新清单(manifest)地址：http(s)://host/path/version.json
; 留空时仅使用程序目录下的本地 update.json（离线/U盘升级）。
UpdateUrl=

[Inference]
; 最新模型（local_train_passenger_new，2026-10-21 训练完成并导出，class=person，yolov8m）
;   best.pt → ONNX(opset12, imgsz=640, static 1x5x8400) → TensorRT FP16 引擎（TRT 10, sm_75）
ModelPath=./model/passenger_yolov8m_trt10_x86_20261022_155901.engine
OnnxPath=./model/passenger_yolov8m_trt10_x86_20261022_155901.onnx
ModelKind=person
PreferOnnx=false
Letterbox=true
DnnInputSize=640
; 检测模型：yolov8m（16.reId 现场数据训练，nc=1 单类 object=人体）。
;   由 local_train_passenger_new/weights/best.pt（150 epochs）导出
;   ONNX(opset12, imgsz=640, static 1x5x8400)→TensorRT FP16 引擎（TRT 10.0.1, sm_75）。
; 【重要】实时检测与离线检测共用本路径：两者都经 MainWindow::pickDetectorModelPath() 读取 ModelPath。
; 【回滚】改回 ./model/passenger_yolov8n_trt10_x86_20261016_093408.engine
EnableInference=true
; 【俯视场景召回】yolov8m 空场景误检严重，阈值由 0.30 上调至 0.65（如仍误检可再提到 0.70）
ConfThreshold=0.65
NmsThreshold=0.5
; 关闭“优先 ONNX”：为 true 时会加载 OnnxPath 并在 CPU 上推理。
DnnUseCuda=true
HeadConfThreshold=0.55
HeadMinPersonHeightRatio=0.0250
HeadMinPersonAreaRatio=0.00120
HeadMinBoxWidthPx=22
HeadMinBoxHeightPx=22
HeadMinBoxAspect=0.50
HeadMaxBoxAspect=2.00

[ReID]
; 深度 ReID：OSNet x1.0（passenger_reid_dataset 90 身份微调，2026-10-23 导出；4D 输出与 DeepReID 兼容）
UseDeepReid=true
DeepModelPath=./model/osnet_x1_0_finetuned.onnx
DeepMatchThreshold=0.60
HeadBoxExpand=1.35

[Tracker]
; 画廊轨迹恢复阈值（0.62→0.75）：避免丢失轨迹被不同乘客错误复用导致串 ID
ReidThreshold=0.75
